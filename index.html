<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rutgers Quantitative Finance Club — Links</title>
  <meta name="description" content="Official link hub for the Rutgers Quantitative Finance Club (QFC). Sign in with your Rutgers NetID to access club links." />
  <meta name="color-scheme" content="light dark" />

  <link rel="icon" type="image/png" href="assets/logo_black.png" />
  <link rel="apple-touch-icon" href="assets/logo_black.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="Rutgers Quantitative Finance Club" />
  <meta property="og:description" content="Club links, competitions, research teams, and how to get involved." />
  <meta property="og:type" content="website" />
  <!-- og:image must be absolute; update if you move to a custom domain -->
  <meta property="og:image" content="https://rutgers-quant-finance-club.github.io/clubfairsignup/assets/logo_black.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-accent" aria-hidden="true"></div>

  <div class="page">

    <!-- ============================================================
         SIGN-UP GATE  (initial state — collects everything up front)
    ============================================================= -->
    <section id="gate" class="panel gate" aria-labelledby="gate-title">
      <div class="brand">
        <picture class="brand__mark">
          <source srcset="assets/logo_white.png" media="(prefers-color-scheme: dark)" />
          <img src="assets/logo_black.png" alt="Rutgers Quantitative Finance Club" width="72" height="72" />
        </picture>
        <h1 id="gate-title" class="brand__name">Rutgers Quantitative<br />Finance Club</h1>
        <p class="brand__tag">Fill this out to unlock the club links.</p>
      </div>

      <form id="gate-form" class="form" novalidate>
        <div class="form--grid">
          <div class="field field--full">
            <label class="label" for="netid">Rutgers NetID</label>
            <input
              class="input"
              id="netid"
              name="netid"
              type="text"
              autocomplete="username"
              spellcheck="false"
              autocapitalize="none"
              autocorrect="off"
              placeholder="abc123"
              aria-describedby="gate-hint"
              required
            />
            <p id="gate-hint" class="hint">Just your NetID — we'll reach you at <b>netid@scarletmail.rutgers.edu</b>.</p>
          </div>

          <div class="field">
            <label class="label" for="firstName">First name</label>
            <input class="input" id="firstName" name="firstName" type="text" autocomplete="given-name" required />
          </div>
          <div class="field">
            <label class="label" for="lastName">Last name</label>
            <input class="input" id="lastName" name="lastName" type="text" autocomplete="family-name" required />
          </div>

          <div class="field">
            <label class="label" for="major">Major</label>
            <input class="input" id="major" name="major" type="text" required />
          </div>
          <div class="field">
            <label class="label" for="gradYear">Graduation year</label>
            <select class="input" id="gradYear" name="gradYear" required>
              <option value="" selected disabled>Select…</option>
            </select>
          </div>

          <div class="field field--full">
            <label class="label" for="goals">What do you hope to get out of QFC? <span class="label__opt">(optional)</span></label>
            <textarea class="input" id="goals" name="goals" rows="3" maxlength="600" placeholder="Skills, community, recruiting, research…"></textarea>
          </div>

          <div class="field field--full">
            <label class="label" for="meetTime">When is the best time for the club to meet weekly for you? <span class="label__opt">(optional)</span></label>
            <textarea class="input" id="meetTime" name="meetTime" rows="2" maxlength="300" placeholder="e.g. weekday evenings after 6pm, Friday afternoons…"></textarea>
          </div>
        </div>

        <p id="gate-error" class="error" role="alert" aria-live="assertive"></p>

        <!-- Honeypot: hidden from humans, catches bots -->
        <div class="hp" aria-hidden="true">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <button class="btn btn--primary" type="submit" id="gate-submit">Unlock the links</button>
        <p class="fineprint">We use this only to track club interest and follow up. No spam.</p>
      </form>
    </section>

    <!-- ============================================================
         LINK HUB  (unlocked state)
    ============================================================= -->
    <main id="hub" class="panel hub" hidden aria-labelledby="hub-title">
      <div class="brand brand--compact">
        <picture class="brand__mark">
          <source srcset="assets/logo_white.png" media="(prefers-color-scheme: dark)" />
          <img src="assets/logo_black.png" alt="Rutgers Quantitative Finance Club" width="52" height="52" />
        </picture>
        <h1 id="hub-title" class="brand__name brand__name--sm" tabindex="-1">Rutgers Quantitative Finance Club</h1>
        <p class="brand__tag">Everything you need in one place.</p>
      </div>

      <nav class="links" id="links" aria-label="Club links"><!-- injected by script.js --></nav>

      <ul class="socials" id="socials" aria-label="Social media"><!-- injected by script.js --></ul>

      <footer class="foot">
        <span>© <span id="year"></span> Rutgers QFC</span>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
